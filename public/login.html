<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>כניסה — QASmart</title>
    <style>
        :root {
            --c-primary: #3a6ea5;
            --c-primary-hover: #2a5a8a;
            --c-text-primary: #2d3748;
            --c-text-secondary: #4a5568;
            --c-text-muted: #718096;
            --c-border: #e2e8f0;
            --c-bg-light: #f7fafc;
            --c-bg-subtle: #edf2f7;
            --c-error-accent: #e53e3e;
            --c-error-bg: #fed7d7;
            --c-error-text: #9b2c2c;
            --r-sm: 8px;
            --r-md: 10px;
            --r-lg: 14px;
            --r-xl: 20px;
            --shadow-lg: 0 20px 60px rgba(0,0,0,.15);
            --t-fast: 0.15s ease;
            --t-base: 0.25s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #3a6ea5 50%, #2a5a8a 100%);
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: var(--r-xl);
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-lg);
            text-align: center;
        }
        .login-logo {
            font-size: 48px;
            margin-bottom: 8px;
        }
        .login-title {
            font-size: 28px;
            font-weight: 800;
            color: var(--c-text-primary);
            margin-bottom: 6px;
        }
        .login-subtitle {
            font-size: 14px;
            color: var(--c-text-muted);
            margin-bottom: 32px;
        }
        .form-group {
            text-align: right;
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--c-text-secondary);
            margin-bottom: 8px;
        }
        .input-wrapper {
            position: relative;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            padding-left: 48px;
            border: 2px solid var(--c-border);
            border-radius: var(--r-md);
            font-size: 16px;
            font-weight: 500;
            color: var(--c-text-primary);
            background: white;
            transition: border-color var(--t-base), box-shadow var(--t-base);
            direction: ltr;
            text-align: right;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--c-primary);
            box-shadow: 0 0 0 3px rgba(58, 110, 165, 0.15);
        }
        .form-group input.error {
            border-color: var(--c-error-accent);
            box-shadow: 0 0 0 3px rgba(229, 62, 62, 0.15);
        }
        .toggle-password {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: var(--c-text-muted);
            padding: 4px;
            transition: color var(--t-fast);
        }
        .toggle-password:hover { color: var(--c-text-primary); }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--c-primary);
            color: white;
            border: none;
            border-radius: var(--r-md);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background var(--t-fast), transform var(--t-fast), box-shadow var(--t-fast);
        }
        .login-btn:hover {
            background: var(--c-primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(58, 110, 165, 0.3);
        }
        .login-btn:active { transform: translateY(0); }
        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .error-msg {
            display: none;
            background: var(--c-error-bg);
            color: var(--c-error-text);
            padding: 12px 16px;
            border-radius: var(--r-sm);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 16px;
        }
        .error-msg.visible { display: block; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }
        .shake { animation: shake 0.4s ease; }
        @media (max-width: 480px) {
            .login-card { padding: 36px 24px; }
            .login-title { font-size: 24px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="login-card" id="loginCard">
        <div class="login-logo">🔒</div>
        <h1 class="login-title">QASmart</h1>
        <p class="login-subtitle">הזן סיסמה כדי להיכנס למערכת</p>

        <div class="error-msg" id="errorMsg"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="password">סיסמה</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="הזן סיסמה..." autocomplete="current-password" autofocus />
                    <button type="button" class="toggle-password" id="togglePw" title="הצג/הסתר סיסמה">👁️</button>
                </div>
            </div>
            <button type="submit" class="login-btn" id="loginBtn">כניסה</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const pwInput = document.getElementById('password');
        const errorMsg = document.getElementById('errorMsg');
        const loginBtn = document.getElementById('loginBtn');
        const card = document.getElementById('loginCard');
        const togglePw = document.getElementById('togglePw');

        togglePw.addEventListener('click', () => {
            const isPassword = pwInput.type === 'password';
            pwInput.type = isPassword ? 'text' : 'password';
            togglePw.textContent = isPassword ? '🙈' : '👁️';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = pwInput.value.trim();
            if (!password) {
                showError('יש להזין סיסמה');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'מתחבר...';
            errorMsg.classList.remove('visible');
            pwInput.classList.remove('error');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    window.location.href = '/';
                } else {
                    showError(data.error || 'סיסמה שגויה');
                }
            } catch (err) {
                showError('שגיאת חיבור לשרת');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'כניסה';
            }
        });

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.add('visible');
            pwInput.classList.add('error');
            card.classList.remove('shake');
            void card.offsetWidth;
            card.classList.add('shake');
            pwInput.focus();
        }
    </script>
</body>
</html>
